  /* question / answer flow */
  .question-block { margin-top: 4px; }

  .answer-input-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  input[type="text"], input[type="number"] {

  .feedback-box .verdict { font-weight: 700; margin-bottom: 6px; display: block; }
  .feedback-box .verdict.good-text { color: var(--good); }

  .feedback-box code, .feedback-box .formula { font-family: var(--font-mono); color: var(--gold-bright); }

  .next-row { margin-top: 18px; display: flex; justify-content: flex-end; }

  /* EV bar */
  .ev-scale {

    border-radius: 10px;
    padding: 12px 14px;
    border: 1px solid rgba(241,236,221,0.1);

  .info-cell .label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.09em; color: var(--cream-dim); }
  .info-cell .value { font-family: var(--font-mono); font-size: 1.15rem; color: var(--gold-bright); font-weight: 700; margin-top: 3px; }

  /* Monte Carlo */
  .mc-controls { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
  .mc-select-group label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); margin-bottom: 6px; }
  select {
    background: rgba(241,236,221,0.08);
    border: 1px solid rgba(241,236,221,0.3);
    color: var(--cream);
    padding: 9px 10px;
    border-radius: 8px;
    font-family: var(--font-body);

  .mc-bars { margin-top: 22px; }

  .mc-bar-row .mc-label { width: 90px; font-family: var(--font-mono); font-size: 0.85rem; flex-shrink: 0; }
  .mc-bar-track { flex: 1; height: 22px; background: rgba(0,0,0,0.25); border-radius: 6px; overflow: hidden; }
  .mc-bar-fill { height: 100%; border-radius: 6px; transition: width 0.4s ease; }
  .mc-bar-fill.p1 { background: linear-gradient(90deg, #3a7c5c, var(--good)); }
  .mc-bar-fill.p2 { background: linear-gradient(90deg, #8f4a3f, var(--bad)); }
  .mc-bar-fill.tie { background: var(--cream-dim); }
  .mc-pct { width: 60px; text-align: right; font-family: var(--font-mono); font-weight: 700; flex-shrink: 0; }
  .mc-progress-label { font-family: var(--font-mono); font-size: 0.82rem; color: var(--cream-dim); margin-top: 10px; }

  .explainer {
    font-size: 0.85rem;
    color: var(--cream-dim);
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed rgba(241,236,221,0.15);
    line-height: 1.55;
  }
  .explainer b { color: var(--cream); }

  footer.hint {
    text-align: center;
    color: var(--cream-dim);
    font-size: 0.78rem;
    margin-top: 34px;
  }

  @media (max-width: 640px) {
    .stats-strip { flex-wrap: wrap; }
    .pcard { width: 46px; height: 64px; font-size: 0.95rem; }
  }
</style>

<body>
<div class="app" id="app"></div>

<script>
/* =========================================================================
   RAKE & REASON — a Duolingo-style trainer for poker statistics
   Single-file vanilla JS app. No build step required.
   ========================================================================= */

/* ---------------------------- Poker primitives ---------------------------- */
const RANKS = ['2','3','4','5','6','7','8','9','T','J','Q','K','A'];
const SUITS = ['s','h','d','c'];
const SUIT_SYMBOL = { s: '♠', h: '♥', d: '♦', c: '♣' };
const SUIT_COLOR = { s: 'black', h: 'red', d: 'red', c: 'black' };

function rankValue(r) { return RANKS.indexOf(r) + 2; }
function makeDeck() {
  const deck = [];
  for (const r of RANKS) for (const s of SUITS) deck.push(r + s);
  return deck;
}
function shuffle(deck) {
  const d = deck.slice();
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function combinationsArr(arr, k) {
  const result = [];
  const combo = [];
  (function helper(start) {
    if (combo.length === k) { result.push(combo.slice()); return; }
    for (let i = start; i < arr.length; i++) {
      combo.push(arr[i]);
      helper(i + 1);
      combo.pop();
    }
  })(0);
  return result;
}
function nCr(n, r) {
  if (r < 0 || r > n) return 0;
  r = Math.min(r, n - r);
  let num = 1, den = 1;
  for (let i = 0; i < r; i++) { num *= (n - i); den *= (i + 1); }
  return Math.round(num / den);
}

function evaluate5(cards) {
  const ranks = cards.map(c => rankValue(c[0])).sort((a, b) => b - a);
  const suits = cards.map(c => c[1]);
  const isFlush = suits.every(s => s === suits[0]);
  const counts = {};
  for (const r of ranks) counts[r] = (counts[r] || 0) + 1;
  const groups = Object.entries(counts)
    .map(([r, c]) => [parseInt(r), c])
    .sort((a, b) => b[1] - a[1] || b[0] - a[0]);
  const uniqueRanksDesc = [...new Set(ranks)].sort((a, b) => b - a);
  let straightHigh = null;
  if (uniqueRanksDesc.length === 5) {
    if (uniqueRanksDesc[0] - uniqueRanksDesc[4] === 4) straightHigh = uniqueRanksDesc[0];
    else if (JSON.stringify(uniqueRanksDesc) === JSON.stringify([14, 5, 4, 3, 2])) straightHigh = 5;
  }
  const pattern = groups.map(g => g[1]).join('');
  if (straightHigh && isFlush) return [8, straightHigh];
  if (pattern === '41') return [7, groups[0][0], groups[1][0]];
  if (pattern === '32') return [6, groups[0][0], groups[1][0]];
  if (isFlush) return [5, ...ranks];
  if (straightHigh) return [4, straightHigh];
  if (pattern === '311') return [3, groups[0][0], ...groups.slice(1).map(g => g[0]).sort((a, b) => b - a)];
  if (pattern === '221') return [2, Math.max(groups[0][0], groups[1][0]), Math.min(groups[0][0], groups[1][0]), groups[2][0]];
  if (pattern === '2111') return [1, groups[0][0], ...groups.slice(1).map(g => g[0]).sort((a, b) => b - a)];
  return [0, ...ranks];
}
function compareHandArr(a, b) {
  const len = Math.max(a.length, b.length);
  for (let i = 0; i < len; i++) {
    const av = a[i] ?? -1, bv = b[i] ?? -1;
    if (av !== bv) return av - bv;
  }
  return 0;
}
function evaluateBest(cards) {
  if (cards.length === 5) return evaluate5(cards);
  let best = null;
  for (const c of combinationsArr(cards, 5)) {
    const val = evaluate5(c);
    if (!best || compareHandArr(val, best) > 0) best = val;
  }
  return best;
}
const HAND_NAMES = ['High Card', 'Pair', 'Two Pair', 'Trips', 'Straight', 'Flush', 'Full House', 'Quads', 'Straight Flush'];

function cardEl(card, ghost) {
  if (ghost) return `<div class="pcard ghost">?</div>`;
  const r = card[0], s = card[1];
  const color = SUIT_COLOR[s];
  return `<div class="pcard ${color}"><span>${r}</span><span class="suit-sym">${SUIT_SYMBOL[s]}</span></div>`;
}
function cardsHtml(cards, ghostCount) {
  let html = cards.map(c => cardEl(c)).join('');
  if (ghostCount) for (let i = 0; i < ghostCount; i++) html += cardEl(null, true);
  return html;
}

/* ---------------------------- Global app state ---------------------------- */
const state = {
  module: 'odds',
  difficulty: 'beginner', // beginner | intermediate | advanced
  score: 0,
  streak: 0,
  answered: 0,
  correct: 0,
  // per-module question progress
  oddsIdx: 0,
  comboIdx: 0,
  potIdx: 0,
  evIdx: 0,
  currentAnswer: null, // holds revealed/answered flag per question view
};

const MODULES = [
  { id: 'odds', label: 'Poker Odds' },
  { id: 'combo', label: 'Combinatorics' },
  { id: 'pot', label: 'Pot Odds' },
  { id: 'ev', label: 'EV Trainer' },
  { id: 'coach', label: 'AI Coach' },
  { id: 'mc', label: 'Simulator' },
];

function render() {
  const app = document.getElementById('app');
  app.innerHTML = `
    ${renderHeader()}
    ${renderNav()}
    ${renderDifficulty()}
    <div class="panel">${renderModule()}</div>
    <footer class="hint">Built for learning — verify decisions with a full solver before playing real stakes with real money.</footer>
  `;
  attachHandlers();
}

function renderHeader() {
  const acc = state.answered ? Math.round((state.correct / state.answered) * 100) : 0;
  return `
  <header class="top">
    <div class="brand">
      <span class="suit">♠♥</span>
      <div>
        <h1>Rake &amp; Reason</h1>
        <span class="tag">Become a better player by mastering the math</span>
      </div>
    </div>
    <div class="stats-strip">
      <div class="stat-pill">🔥 <span class="n">${state.streak}</span> streak</div>
      <div class="stat-pill">⭐ <span class="n">${state.score}</span> pts</div>
      <div class="stat-pill">🎯 <span class="n">${acc}%</span> accuracy</div>
    </div>
  </header>`;
}

function renderNav() {
  return `
  <nav class="modules">
    ${MODULES.map((m, i) => `
      <button data-module="${m.id}" class="${state.module === m.id ? 'active' : ''}">
        <span class="num">${String(i + 1).padStart(2, '0')}</span>${m.label}
      </button>
    `).join('')}
  </nav>`;
}

function renderDifficulty() {
  const levels = [['beginner', 'Beginner'], ['intermediate', 'Intermediate'], ['advanced', 'Advanced']];
  return `
  <div class="difficulty-row">
    <span>Difficulty</span>
    <div class="seg">
      ${levels.map(([id, label]) => `<button data-diff="${id}" class="${state.difficulty === id ? 'active' : ''}">${label}</button>`).join('')}
    </div>
  </div>`;
}

function renderModule() {
  switch (state.module) {
    case 'odds': return renderOddsModule();
    case 'combo': return renderComboModule();
    case 'pot': return renderPotOddsModule();
    case 'ev': return renderEvModule();
    case 'coach': return renderCoachModule();
    case 'mc': return renderMonteCarloModule();
    default: return '';
  }
}

/* =========================================================================
   MODULE 1 — POKER ODDS
   ========================================================================= */
const ODDS_QUESTIONS = {
  beginner: [
    {
      hole: ['Ah', 'Kh'], board: ['Qh', '8h', '2c'],
      prompt: "You hold A♥K♥ on a Q♥8♥2♣ flop. Two cards to come. What's the probability you make a flush by the river?",
      outs: 9, unseen: 47, twoCards: true,
      explain: "You have 9 hearts left in the deck (13 − 4 you can see) out of 47 unseen cards. With two cards still to come, the exact probability is 1 − (38/47 × 37/46). The quick 'rule of 4' estimate (9 outs × 4 ≈ 36%) gets you very close."
    },
    {
      hole: ['9c', '8c'], board: ['7c', '2d', '2s'],
      prompt: "You hold 9♣8♣ on a 7♣2♦2♠ flop (no flush draw). You need a straight — you're open-ended. Two cards to come. What's the probability you hit your straight by the river?",
      outs: 8, unseen: 47, twoCards: true,
      explain: "An open-ended straight draw has 8 outs (four 6s and four Ts). With two cards to come: 1 − (39/47 × 38/46) ≈ 31.5%. The rule-of-4 shortcut (8 × 4 = 32%) is a near-perfect estimate here."
    },
  ],
  intermediate: [
    {
      hole: ['Jd', 'Td'], board: ['9d', '3h', '2c', 'Ah'],
      prompt: "You hold J♦T♦ on a 9♦3♥2♣A♥ turn (one card to come). You have a gutshot to a straight (need a Q). What's the probability you hit on the river?",
      outs: 4, unseen: 46, twoCards: false,
      explain: "One card to come, 4 outs (the four Queens) out of 46 unseen cards: 4/46 ≈ 8.7%. This is why the 'rule of 2' (4 × 2 = 8%) is the correct shortcut with only one card left."
    },
    {
      hole: ['Kc', 'Qc'], board: ['7c', '4c', '9h'],
      prompt: "You hold K♣Q♣ on a 7♣4♣9♥ flop — a flush draw. Two cards to come. What's the probability you complete the flush by the river?",
      outs: 9, unseen: 47, twoCards: true,
      explain: "Same math as any flush draw: 9 outs, 47 unseen, two cards to come → 1 − (38/47 × 37/46) ≈ 35.0%."
    },
  ],
  advanced: [
    {
      hole: ['Ks', 'Kd'], board: ['Kh', '7s', '2d'],
      prompt: "You flopped a set with K♠K♦ on K♥7♠2♦. Two cards to come. What's the probability you improve to a full house or quads by the river?",

      explain: "A set has 10 outs to improve: 7 cards pair the board (giving a full house) + 3 remaining kings for quads = 10 outs. Over two cards: 1 − (37/47 × 36/46) ≈ 38.4%."
    },
    {
      hole: ['Ah', '9h'], board: ['Kh', '7c', '2h'],
      prompt: "You hold A♥9♥ on K♥7♣2♥ — a flush draw plus two overcards aren't in play here, but you also pick up backdoor relevance. Focusing only on the flush: two cards to come, what's your probability of making the flush by the river?",
      outs: 9, unseen: 47, twoCards: true,
      explain: "Still a standard 9-out flush draw: 1 − (38/47 × 37/46) ≈ 35.0%. Advanced players layer in backdoor equity and overcard outs separately rather than lumping them together."
    },
  ],
};

function getOddsQ() {
  const list = ODDS_QUESTIONS[state.difficulty];
  return list[state.oddsIdx % list.length];
}

function exactProb(q) {
  if (q.twoCards) {
    const miss = q.unseen - q.outs;
    const missBoth = (miss / q.unseen) * ((miss - 1) / (q.unseen - 1));
    return (1 - missBoth) * 100;
  }
  return (q.outs / q.unseen) * 100;
}

function renderOddsModule() {
  const q = getOddsQ();
  const answered = state.currentAnswer !== null && state.currentAnswer.module === 'odds';
  return `

function genPotScenario(difficulty) {
  const pots = { beginner: [40, 60, 80, 100], intermediate: [75, 120, 150, 220], advanced: [90, 140, 260, 340] };
  const potList = pots[difficulty];
  const pot = potList[Math.floor(Math.random() * potList.length)];
  const betFrac = [0.33, 0.5, 0.66, 0.75, 1.0][Math.floor(Math.random() * 5)];
  const bet = Math.round(pot * betFrac);
  const equity = Math.round(15 + Math.random() * 55); // 15-70%
  return { pot, bet, equity };
}

function renderPotOddsModule() {
  if (!state._potScenario) state._potScenario = genPotScenario(state.difficulty);
  const s = state._potScenario;
  const answered = state.currentAnswer !== null && state.currentAnswer.module === 'pot';
  const potAfterBet = s.pot + s.bet;
  const requiredEquity = (s.bet / (potAfterBet + s.bet)) * 100;

  return `
  <h2>Module 3 · Pot Odds</h2>
  <p class="sub">The math that decides whether a call is profitable — every single time you face a bet.</p>

  <div class="info-grid">
    <div class="info-cell"><div class="label">Pot (before bet)</div><div class="value">${s.pot} chips</div></div>
    <div class="info-cell"><div class="label">Opponent bets</div><div class="value">${s.bet} chips</div></div>
    <div class="info-cell"><div class="label">Your equity</div><div class="value">${s.equity}%</div></div>
  </div>

  <div class="question-block">
    <p class="question-text">Facing this bet with ${s.equity}% equity to win the hand — is calling profitable? Fold, call, or raise?</p>
    ${!answered ? `
      <div class="choice-row">
        <button class="choice-btn" data-pot-choice="fold">Fold</button>
        <button class="choice-btn" data-pot-choice="call">Call</button>
        <button class="choice-btn" data-pot-choice="raise">Raise</button>
      </div>
    ` : renderPotFeedback(s, requiredEquity)}
  </div>
  <div class="explainer"><b>The formula:</b> required equity = bet ÷ (pot after your call + bet). If your real equity beats that number, calling is +EV.</div>
  `;
}

function renderPotFeedback(s, requiredEquity) {
  const correctChoice = s.equity > requiredEquity ? 'call' : 'fold';
  const userChoice = state.currentAnswer.userVal;
  // "raise" is judged correct if equity is well above required (dominant edge)
  const isGood = (userChoice === correctChoice) || (userChoice === 'raise' && s.equity > requiredEquity + 20);
  return `

  `;
}

function heuristicCoachAnalysis(text) {

  const lines = text.split('\n').filter(l => l.trim());

  const streets = ['Flop', 'Turn', 'River'].filter(s => text.includes(s)).length;

  let sizingNote = 'No clear bet sizes detected — try including amounts like "bets 4bb".';
  if (bets.length && potMatches.length) {

    sizingNote = `Detected bet sizing around ${ratios.join('%, ')}% of pot across the streets you bet. Sizes in the 50–75% range tend to balance value and bluffs well; very small or very large sizes narrow your effective range.`;
  }
  return `

    <span class="verdict good-text">Heuristic read-through</span>

  </div>`;
}

function runMonteCarlo(h1, h2, iterations, onDone, onProgress) {
  const baseDeck = makeDeck();
  const used = [...h1, ...h2];
  const remaining = baseDeck.filter(c => !used.includes(c));
  let win1 = 0, win2 = 0, tie = 0, done = 0;
  const chunk = 500;

  function step() {
    const thisChunk = Math.min(chunk, iterations - done);
    for (let i = 0; i < thisChunk; i++) {
      const shuffled = shuffle(remaining);
      const board = shuffled.slice(0, 5);
      const r1 = evaluateBest([...h1, ...board]);
      const r2 = evaluateBest([...h2, ...board]);
      const cmp = compareHandArr(r1, r2);
      if (cmp > 0) win1++;
      else if (cmp < 0) win2++;
      else tie++;
    }
    done += thisChunk;
    onProgress(done, iterations);
    if (done < iterations) {
      setTimeout(step, 0);
    } else {
      onDone({ win1: win1 / iterations, win2: win2 / iterations, tie: tie / iterations });
    }
  }
  step();
}

    <div class="mc-bar-row">
      <div class="mc-label">Hand 2</div>
      <div class="mc-bar-track"><div class="mc-bar-fill p2" style="width:${(result.win2*100).toFixed(1)}%"></div></div>
      <div class="mc-pct">${(result.win2*100).toFixed(1)}%</div>
    </div>
    <div class="mc-bar-row">
      <div class="mc-label">Tie</div>
      <div class="mc-bar-track"><div class="mc-bar-fill tie" style="width:${(result.tie*100).toFixed(1)}%"></div></div>
      <div class="mc-pct">${(result.tie*100).toFixed(1)}%</div>
    </div>
  </div>
  <div class="mc-progress-label">${iterations.toLocaleString()} hands simulated.</div>
  `;
}

/* ---------------------------- Scoring ---------------------------- */
function submitAnswer(module, userVal) {
  let isCorrect = false;
  if (module === 'odds') {
    const q = getOddsQ();
    isCorrect = Math.abs(userVal - exactProb(q)) <= 3;
  } else if (module === 'combo') {
    const q = getComboQ();
    isCorrect = Number(userVal) === q.answer;
  } else if (module === 'pot') {
    const s = state._potScenario;
    const requiredEquity = (s.bet / (s.pot + 2 * s.bet)) * 100;
    const correctChoice = s.equity > requiredEquity ? 'call' : 'fold';
    isCorrect = (userVal === correctChoice) || (userVal === 'raise' && s.equity > requiredEquity + 20);
  } else if (module === 'ev') {
    const q = getEvQ();
    isCorrect = Math.abs(Number(userVal) - q.callEV) <= Math.max(3, Math.abs(q.callEV) * 0.15);
  }

  state.answered++;
  if (isCorrect) {
    state.correct++;
    state.streak++;
    state.score += 10 + Math.min(state.streak, 10);
  } else {
    state.streak = 0;
  }
  state.currentAnswer = { module, userVal };
  render();
}

/* ---------------------------- Boot ---------------------------- */
render();
</script>
